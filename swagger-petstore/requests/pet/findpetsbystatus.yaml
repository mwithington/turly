name: findPetsByStatus
method: GET
url: '{{base_url}}/pet/findByStatus'
params:
- key: status
  value: '["available"]'
  enabled: true
auth:
  type: none
body:
  type: none
  content: ''
docs: |-
  Finds Pets by status

  Multiple status values can be provided with comma separated strings
order: 3
follow_redirects: true
