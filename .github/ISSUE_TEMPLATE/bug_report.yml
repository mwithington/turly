name: Bug report
description: Something in Turly is broken or behaves unexpectedly
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Turly version
      description: Output of `turly --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and terminal
      description: For example, macOS 15 + WezTerm, Ubuntu 24.04 + Alacritty
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. turly import spec.yaml
        2. ...
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: A sample OpenAPI spec, request file or config snippet helps. Remove secrets first.
